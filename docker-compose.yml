services:

  # =========================
  # MySQL Database
  # =========================
  mysql:
    image: mysql:8.4
    container_name: movie-ticket-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: movie-ticket-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # Spring Boot Backend
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: movie-ticket-backend
    restart: unless-stopped

    ports:
      - "8081:8081"

    env_file:
    - ./backend/.env

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SERVER_PORT: 8081

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================
  # ReactJS Frontend
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    container_name: movie-ticket-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend


# =========================
# Persistent Volumes
# =========================
volumes:
  mysql_data:
  redis_data:
